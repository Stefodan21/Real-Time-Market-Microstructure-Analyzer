name: Ping Render Service

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render endpoint
        env:
          RENDER_PING_URL: ${{ vars.VITE_BACKEND_URL }}
        run: >-
          for i in {1..3}; do
            curl -fsS "$RENDER_PING_URL/ping" && break
            sleep 10
          done
